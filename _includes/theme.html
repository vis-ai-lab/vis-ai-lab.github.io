<div class='theme'>
  <img class="theme-thumbnail" src="{{ 'assets' | relative_url }}/{{ theme.image }}" alt="{{ theme.title }}" />
  <div class="theme-body">
    <div class="theme-title">{{ theme.title }}</div>
    <div class='theme-content'>
      {% assign sorted = site.publications | where_exp: "pub", "pub.tags contains theme.keyword" | sort: 'year' | reverse %}
      {% for publication in sorted %}
      <a class="theme-paper" href="{{ publication.publisher_url }}">{{ publication.venue_name_short | default: publication.venue_name }} {{ publication.year }}</a>
      {% endfor %}
    </div>
  </div>
</div>
